name: "Setup Python Environment"
description: "Set up Python environment for the given Python version"

inputs:
  python-version:
    description: "Python version to use"
    required: true
    default: "3.13"
  check-latest:
    description: "Resolve the newest published patch release instead of the runner's cached one"
    required: false
    default: "false"
  refresh-quickjs:
    description: "Resolve the newest quickjs-ng release for a release build"
    required: false
    default: "false"
  managed-python:
    description: "On macOS, run tests on uv-managed CPython instead of setup-python's (no effect elsewhere)"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}
        check-latest: ${{ inputs.check-latest }}
        allow-prereleases: true

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: "true"
        cache-suffix: ${{ inputs.python-version }}

    # macOS 15+ runners stall name lookups for about 35 seconds in Python from
    # setup-python or Homebrew (no Local Network permission), which made each
    # px startup take that long. uv-managed CPython is not affected.
    - name: Use uv-managed CPython (macOS)
      if: runner.os == 'macOS' && inputs.managed-python == 'true'
      shell: bash
      run: echo "UV_PYTHON_PREFERENCE=only-managed" >> "$GITHUB_ENV"

    # TEMPORARY until pymcurl 8.23.0.3 is on PyPI (docs/build.md): uv.lock
    # still pins the PyPI pymcurl, so relock only pymcurl against the devel
    # wheels in this runner's checkout. The relocked file is never committed.
    - name: Use pymcurl devel wheels
      uses: ./.github/actions/mcurl-devel

    - name: Relock pymcurl against the devel wheels
      shell: bash
      run: uv lock --upgrade-package pymcurl

    - name: Install locked dependencies
      run: |
        PYARG=""
        if [ "$RUNNER_OS" = "macOS" ] && [ "${{ inputs.managed-python }}" = "true" ]; then
          PYARG="--python ${{ inputs.python-version }}"
        fi
        if [ "${{ inputs.refresh-quickjs }}" = "true" ]; then
          # Release builds deliberately resolve the latest quickjs-ng.
          uv sync --upgrade-package quickjs-ng $PYARG
        else
          uv sync --locked $PYARG
        fi
        uv pip install -e .
        uv run --locked python -c "from importlib.metadata import version; print(f'quickjs-ng version: {version(\"quickjs-ng\")}')"
        uv run --locked python .github/actions/mcurl-devel/check.py
      shell: bash
