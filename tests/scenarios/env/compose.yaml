# tests/scenarios/env/scenario-env.sh sets the project name, source checkout,
# and subnet per SCENARIO_INSTANCE so parallel checkouts each run a private lab.
name: px-scenario

x-proxy: &proxy
  build: ./proxy
  restart: unless-stopped
  volumes:
    - shared:/shared
  networks:
    corp:

services:
  dc:
    build: ./dc
    # Samba AD requires filesystem ACL/xattr operations unavailable in an
    # unprivileged Docker container; no service publishes its AD ports.
    privileged: true
    hostname: dc
    domainname: corp.test
    volumes:
      - shared:/shared
      - squid-logs:/var/log/squid
    networks:
      corp:
        aliases: [dc.corp.test, squid-sso.corp.test]
        ipv4_address: ${SCENARIO_SUBNET:-172.30.0}.10

  squid-basic:
    <<: *proxy
    hostname: squid-basic
    domainname: corp.test
    environment: [SCHEME=basic]

  squid-digest:
    <<: *proxy
    hostname: squid-digest
    domainname: corp.test
    environment: [SCHEME=digest]

  squid-close:
    <<: *proxy
    hostname: squid-close
    domainname: corp.test
    environment: [SCHEME=close, MAXCONN=16]

  squid-parent:
    <<: *proxy
    hostname: squid-parent
    domainname: corp.test
    environment: [SCHEME=parent]
    networks:
      corp:
        aliases: [squid-parent.corp.test]

  squid-child:
    <<: *proxy
    hostname: squid-child
    domainname: corp.test
    environment: [SCHEME=child]
    depends_on:
      squid-parent:
        condition: service_healthy

  origin:
    build: ./origin
    hostname: origin
    domainname: corp.test
    environment: ["PAC_PROXY=squid-sso.corp.test:3128"]
    volumes:
      - shared:/shared
    networks:
      corp:
        aliases: [origin.corp.test, pac.corp.test, echo.corp.test]

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    volumes:
      - ./toxiproxy.json:/config/toxiproxy.json:ro
    depends_on:
      dc:
        condition: service_healthy
    networks: [corp]

  client:
    build: ./client
    depends_on:
      squid-basic:
        condition: service_healthy
      squid-digest:
        condition: service_healthy
      dc:
        condition: service_healthy
      squid-close:
        condition: service_healthy
      squid-child:
        condition: service_healthy
      origin:
        condition: service_healthy
    volumes:
      - shared:/shared:ro
      - squid-logs:/scenario-logs:ro
      # The runner executes the checkout itself, not code baked into this image.
      - ${SCENARIO_SOURCE_DIR:-../../..}:/px:ro
    networks: [corp]

networks:
  corp:
    ipam:
      config:
        - subnet: ${SCENARIO_SUBNET:-172.30.0}.0/24

volumes:
  shared:
  squid-logs:
