name: CI

on:
  workflow_dispatch:
    inputs:
      full:
        description: "Run the full matrix (all Pythons, OSes, architectures, event loops, musl, benchmarks, large-data, slow tests)"
        type: boolean
        default: true
  workflow_call:
    inputs:
      full:
        description: "Run the full matrix (all Pythons, OSes, architectures, event loops, musl, benchmarks, large-data, slow tests)"
        type: boolean
        default: true
  schedule:
    - cron: "37 5 * * 0"
  push:
    branches: [devel, working]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.plan.outputs.full }}
      marker: ${{ steps.plan.outputs.marker }}
      tests: ${{ steps.plan.outputs.tests }}
      musl: ${{ steps.plan.outputs.musl }}
      scenario: ${{ steps.plan.outputs.scenario }}
    steps:
      - uses: actions/checkout@v7

      - name: Select the matrix
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          FULL_INPUT: ${{ inputs.full }}
          FAST_MARKER: not integration and not benchmark and not largedata and not slow
          TESTS_FAST: |
            {"include": [
              {"os": "ubuntu-latest", "python-version": "3.10"},
              {"os": "ubuntu-latest", "python-version": "3.14"},
              {"os": "ubuntu-latest", "python-version": "3.14", "event-loop": "asyncio"},
              {"os": "windows-latest", "python-version": "3.14"},
              {"os": "windows-latest", "python-version": "3.14", "event-loop": "asyncio"}
            ]}
          TESTS_FULL: |
            {"include": [
              {"os": "ubuntu-latest", "python-version": "3.10"},
              {"os": "ubuntu-latest", "python-version": "3.11"},
              {"os": "ubuntu-latest", "python-version": "3.12"},
              {"os": "ubuntu-latest", "python-version": "3.13"},
              {"os": "ubuntu-latest", "python-version": "3.14"},
              {"os": "ubuntu-latest", "python-version": "3.14", "event-loop": "asyncio"},
              {"os": "ubuntu-24.04-arm", "python-version": "3.10"},
              {"os": "ubuntu-24.04-arm", "python-version": "3.14"},
              {"os": "macos-latest", "python-version": "3.10"},
              {"os": "macos-latest", "python-version": "3.14"},
              {"os": "windows-latest", "python-version": "3.10"},
              {"os": "windows-latest", "python-version": "3.14"},
              {"os": "windows-latest", "python-version": "3.14", "event-loop": "asyncio"}
            ]}
          MUSL_FAST: |
            {"include": [
              {"os": "ubuntu-latest", "image": "quay.io/pypa/musllinux_1_2_x86_64", "name": "musl-x86_64", "pyver": "314"}
            ]}
          MUSL_FULL: |
            {"include": [
              {"os": "ubuntu-latest", "image": "quay.io/pypa/musllinux_1_2_x86_64", "name": "musl-x86_64", "pyver": "310"},
              {"os": "ubuntu-latest", "image": "quay.io/pypa/musllinux_1_2_x86_64", "name": "musl-x86_64", "pyver": "314"},
              {"os": "ubuntu-24.04-arm", "image": "quay.io/pypa/musllinux_1_2_aarch64", "name": "musl-aarch64", "pyver": "310"},
              {"os": "ubuntu-24.04-arm", "image": "quay.io/pypa/musllinux_1_2_aarch64", "name": "musl-aarch64", "pyver": "314"}
            ]}
          SCENARIO_FULL: |
            {"include": [
              {"os": "ubuntu-latest", "python-version": "3.10", "event-loop": "auto"},
              {"os": "ubuntu-latest", "python-version": "3.10", "event-loop": "asyncio"},
              {"os": "ubuntu-latest", "python-version": "3.11", "event-loop": "auto"},
              {"os": "ubuntu-latest", "python-version": "3.11", "event-loop": "asyncio"},
              {"os": "ubuntu-latest", "python-version": "3.12", "event-loop": "auto"},
              {"os": "ubuntu-latest", "python-version": "3.12", "event-loop": "asyncio"},
              {"os": "ubuntu-latest", "python-version": "3.13", "event-loop": "auto"},
              {"os": "ubuntu-latest", "python-version": "3.13", "event-loop": "asyncio"},
              {"os": "ubuntu-latest", "python-version": "3.14", "event-loop": "auto"},
              {"os": "ubuntu-latest", "python-version": "3.14", "event-loop": "asyncio"}
            ]}
        run: |
          # An explicit `full` input wins; otherwise only schedules run the full lane
          if [ "$FULL_INPUT" = true ] || { [ "$FULL_INPUT" != false ] && [ "$EVENT_NAME" = schedule ]; }; then
            echo full=true
            echo marker=
            echo "tests=$(jq -c . <<< "$TESTS_FULL")"
            echo "musl=$(jq -c . <<< "$MUSL_FULL")"
            echo "scenario=$(jq -c . <<< "$SCENARIO_FULL")"
          else
            echo full=false
            echo "marker=$FAST_MARKER"
            echo "tests=$(jq -c . <<< "$TESTS_FAST")"
            echo "musl=$(jq -c . <<< "$MUSL_FAST")"
            echo 'scenario={"include":[]}'
          fi >> "$GITHUB_OUTPUT"

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      - name: Run checks
        run: make check

  tests:
    needs: plan
    runs-on: ${{ matrix.os }}
    strategy:
      matrix: ${{ fromJSON(needs.plan.outputs.tests) }}
      fail-fast: false
    defaults:
      run:
        shell: bash
    name: test ${{ matrix.os }} py${{ matrix.python-version }} ${{ matrix.event-loop || 'auto' }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}
          managed-python: "true"

      - name: Run tests
        timeout-minutes: 60
        env:
          MARKER: ${{ needs.plan.outputs.marker }}
        run: |
          if [ "${{ matrix.event-loop }}" == "asyncio" ]; then
            export PX_EVENT_LOOP=asyncio
          fi
          if [ "${{ matrix.os }}" == "macos-latest" ]; then
            export PX_CI_MINIMAL=1
            ignore=(--ignore=tests/test_network.py)
          fi
          uv run --locked python -m pytest tests -n auto --tb=short -q --durations=30 "${ignore[@]}" ${MARKER:+-m "$MARKER"}

  tests-musl:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.musl) }}
    runs-on: ${{ matrix.os }}
    name: test ${{ matrix.name }} py${{ matrix.pyver }}
    steps:
      - uses: actions/checkout@v7

      # TEMPORARY until pymcurl 8.23.0.3 is on PyPI (docs/build.md)
      - name: Use pymcurl devel wheels
        uses: ./.github/actions/mcurl-devel

      - name: Run tests in musllinux container
        timeout-minutes: 60
        env:
          MARKER: ${{ needs.plan.outputs.marker }}
        run: |
          docker run --rm -e MARKER -v ${{ github.workspace }}:/px -w /px \
            -v "$MCURL_WHEELS:/mcurl-wheels" -e UV_FIND_LINKS=/mcurl-wheels -e PX_REQUIRE_MCURL_FIX=1 \
            ${{ matrix.image }} /bin/bash -c '
              PY=/opt/python/cp${{ matrix.pyver }}-cp${{ matrix.pyver }}/bin/python3
              if [ ! -f "$PY" ]; then echo "Python ${{ matrix.pyver }} not found"; exit 1; fi
              curl -LsSf https://astral.sh/uv/install.sh | sh
              . ~/.local/bin/env
              "$PY" -m venv /tmp/test-env
              . /tmp/test-env/bin/activate
              uv pip install --upgrade "quickjs-ng>=0.17.0.2"
              uv pip install -e .
              uv pip install keyring keyrings.alt psutil pytest pytest-xdist pytest-httpbin pytest-cov
              python -c "import importlib.metadata as m; print(\"quickjs-ng version:\", m.version(\"quickjs-ng\"))"
              python .github/actions/mcurl-devel/check.py
              python -m pytest tests -n auto --tb=short -q --durations=30 ${MARKER:+-m "$MARKER"}
            '

  large-data-linux:
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      - name: Run large data transfer tests
        timeout-minutes: 15
        run: uv run --locked python -m pytest tests/test_large_data.py -m largedata -v -s --durations=30

  large-data-windows:
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      - name: Run large data transfer tests
        timeout-minutes: 15
        run: uv run --locked python -m pytest tests/test_large_data.py -m largedata -v -s --durations=30

  benchmark:
    needs: plan
    if: needs.plan.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    name: benchmark ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env
        with:
          managed-python: "true"

      - name: Run benchmarks
        timeout-minutes: 15
        run: uv run --locked python -m pytest tests/test_benchmark.py -m benchmark -v -s --durations=30

  kerberos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      - name: Build Docker images
        run: make docker-kerberos

      - name: Run Kerberos integration tests
        timeout-minutes: 10
        run: uv run --locked python -m pytest tests/test_kerberos.py -m integration -v --durations=30

  scenario-linux:
    needs: plan
    if: needs.plan.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.scenario) }}
    runs-on: ubuntu-latest
    name: scenario py${{ matrix.python-version }} ${{ matrix.event-loop }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}
          managed-python: "true"

      - name: Bring up the corporate proxy scenario environment
        env:
          SCENARIO_INSTANCE: ${{ strategy.job-index }}
        run: tests/scenarios/env/scenario-env.sh up

      # The client container runs pytest and every Px it starts in the private
      # Docker network. The checkout is bind-mounted at /px; the host's mcurl
      # devel wheel is copied into that runner and overlaid after uv sync.
      - name: Run the scenario suite
        timeout-minutes: 60
        env:
          SCENARIO_INSTANCE: ${{ strategy.job-index }}
        run: |
          export UV_PYTHON=${{ matrix.python-version }}
          export PX_EVENT_LOOP=${{ matrix.event-loop }}
          tests/scenarios/env/scenario-env.sh test tests/scenarios -m scenario -v --durations=30 \
            --basetemp=/tmp/px-scenario-tmp

      - name: Collect Squid, Samba and Px logs
        if: failure()
        env:
          SCENARIO_INSTANCE: ${{ strategy.job-index }}
        run: |
          mkdir -p "${{ runner.temp }}/scenario-artifacts"
          tests/scenarios/env/scenario-env.sh logs > "${{ runner.temp }}/scenario-artifacts/compose.log" 2>&1 || true
          tests/scenarios/env/scenario-env.sh artifacts "${{ runner.temp }}/scenario-artifacts" || true

      - name: Upload scenario logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: scenario-logs-py${{ matrix.python-version }}-${{ matrix.event-loop }}
          path: ${{ runner.temp }}/scenario-artifacts
          retention-days: 7

      - name: Tear down the scenario environment
        if: always()
        env:
          SCENARIO_INSTANCE: ${{ strategy.job-index }}
        run: tests/scenarios/env/scenario-env.sh down

  # GitHub's windows-latest runners have no Linux-container backend, so the
  # Docker corporate-proxy lab cannot run directly on the runner, and a
  # separate Linux job cannot expose it either: jobs run on distinct
  # machines with no shared network. WSL2 is the one place on this runner
  # that can run the lab; its built-in localhost forwarding then makes the
  # lab's 127.0.0.1 ports reachable from the Windows side of the same job,
  # which is all a native Windows px needs (DNS for proxied targets such as
  # origin.corp.test is resolved by Squid inside the lab, never by the
  # client). This exercises explicit-credential NTLM and, against the
  # Negotiate-only port (31288, SCENARIO_SSO_WRAPPER_PORT's default), SSPI's
  # own Negotiate package. libcurl 8.23 blocks NTLM inside SPNEGO, so the job
  # gives Windows a route to the lab AD DC and addresses Squid by the hostname
  # in its HTTP SPN. Domain-joined SSPI single sign-on still cannot be set up
  # on a GitHub runner; this uses explicit test credentials.
  scenario-windows:
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: windows-latest
    name: scenario windows NTLM and SSPI Negotiate
    steps:
      - uses: actions/checkout@v7

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.14"

      - name: Set up WSL2
        uses: Vampire/setup-wsl@v5
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2

      - name: Install Docker in WSL2
        shell: wsl-bash {0}
        run: |
          uname -r
          apt-get update
          apt-get install -y curl ca-certificates iptables
          curl -fsSL https://get.docker.com | sh

      - name: Bring up the corporate proxy scenario environment in WSL2
        shell: wsl-bash {0}
        run: |
          service docker start
          for i in $(seq 1 30); do docker info >/dev/null 2>&1 && break; sleep 1; done
          SCENARIO_HOST_PORTS=1 bash tests/scenarios/env/scenario-env.sh up

      - name: Configure Windows Kerberos for the lab
        shell: pwsh
        run: |
          $wslAddress = ((wsl.exe hostname -I).Trim() -split '\s+')[0]
          if (-not $wslAddress) { throw "Could not determine the WSL2 address" }
          Add-Content -Path "$env:WINDIR\System32\drivers\etc\hosts" `
            -Value "`n127.0.0.1 squid-sso.corp.test`n$wslAddress dc.corp.test"
          $klist = "$env:WINDIR\System32\klist.exe"
          & $klist add_bind CORP.TEST dc.corp.test
          if ($LASTEXITCODE -ne 0) { throw "Could not bind CORP.TEST to the lab DC" }
          & $klist query_bind
          $kdc = Test-NetConnection -ComputerName dc.corp.test -Port 88 -InformationLevel Detailed
          $kdc
          if (-not $kdc.TcpTestSucceeded) { throw "The lab KDC is not reachable from Windows" }

          $probe = curl.exe --verbose --fail --proxy-negotiate `
            --proxy-user 'pxgood@CORP.TEST:GoodPass1!' `
            --proxy http://squid-sso.corp.test:31288 `
            http://origin.corp.test:8080/small 2>&1
          $probeExit = $LASTEXITCODE
          $probe | ForEach-Object { Write-Host $_ }
          if ($probeExit -ne 0) { throw "Native curl SSPI Negotiate probe failed: $probeExit" }
          & $klist

      - name: px --test against the NTLM proxy with explicit credentials
        shell: bash
        env:
          PX_PASSWORD: GoodPass1!
        run: |
          config="$RUNNER_TEMP/px-scenario-test.ini"
          : > "$config"
          uv run --locked python -m px --config="$config" --noproxy= \
            --test=http://origin.corp.test:8080/small \
            --proxy=127.0.0.1:31282 --auth=NTLM --username='CORP\pxgood'

      # 31288 is SCENARIO_SSO_WRAPPER_PORT's default: the Squid negotiate_wrapper_auth
      # port that advertises only "Proxy-Authenticate: Negotiate". --test=all: runs
      # GET/POST/PUT/DELETE/PATCH against the origin's /echo endpoint over both auth
      # values the real corporate case needs (NEGOTIATE pins SSPI's Negotiate package;
      # ANY must discover it from the first 407). The UPN identifies the Kerberos
      # realm, and the proxy hostname matches HTTP/squid-sso.corp.test in the lab.
      - name: px --test=all against the Negotiate-only proxy with SSPI (NEGOTIATE and ANY)
        shell: bash
        env:
          PX_PASSWORD: GoodPass1!
        run: |
          fail=0
          for auth in NEGOTIATE ANY; do
            echo "::group::px --test=all --auth=$auth"
            config="$RUNNER_TEMP/px-scenario-test-$auth.ini"
            : > "$config"
            rc=0
            uv run --locked python -m px --config="$config" --noproxy= --verbose \
              --test=all:http://origin.corp.test:8080/echo \
              --proxy=squid-sso.corp.test:31288 --auth=$auth --username='pxgood@CORP.TEST' || rc=$?
            echo "::endgroup::"
            [ $rc -eq 0 ] || { echo "px --test=all --auth=$auth failed with exit code $rc"; fail=1; }
          done
          exit $fail

      # --test=all only sends small bodies; this checks the exact bytes mcurl's
      # Expect:100-continue handling (docs/testing.md) is meant to protect once SSPI
      # has settled on NTLM-in-SPNEGO, for small, multi-MB and chunked (unknown
      # length) bodies on each upload method, by SHA-256 and length at the origin.
      - name: Run px against the Negotiate-only proxy and upload small, multi-MB and chunked bodies
        shell: bash
        env:
          PX_PASSWORD: GoodPass1!
        run: |
          config="$RUNNER_TEMP/px-scenario-negotiate.ini"
          : > "$config"
          uv run --locked python -m px --config="$config" --foreground --log=4 \
            --listen=127.0.0.1 --port=3130 --noproxy= \
            --proxy=squid-sso.corp.test:31288 --auth=NEGOTIATE --username='pxgood@CORP.TEST' \
            --threads=16 --socktimeout=30 > "$RUNNER_TEMP/px-windows-negotiate.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/px-negotiate.pid"
          for i in $(seq 1 30); do
            rc=0
            curl --connect-timeout 1 --silent --output /dev/null http://127.0.0.1:3130 || rc=$?
            [ $rc -ne 7 ] && break
            sleep 1
          done

          small="$RUNNER_TEMP/upload-small.bin"
          big="$RUNNER_TEMP/upload-big.bin"
          uv run --locked python -c "
          import os
          open(r'$small', 'wb').write(os.urandom(12345))
          open(r'$big', 'wb').write(os.urandom(5 * 1024 * 1024))
          "
          small_sha=$(uv run --locked python -c "import hashlib; print(hashlib.sha256(open(r'$small','rb').read()).hexdigest())")
          big_sha=$(uv run --locked python -c "import hashlib; print(hashlib.sha256(open(r'$big','rb').read()).hexdigest())")

          fail=0
          check_upload() {
            method=$1; file=$2; want_sha=$3; want_len=$4; chunked=$5; label=$6
            url="http://origin.corp.test:8080/echo/$label"
            reply_file="$RUNNER_TEMP/reply-$label.json"
            if [ "$chunked" = yes ]; then
              cat "$file" | curl --silent --show-error --max-time 30 --proxy 127.0.0.1:3130 \
                -X "$method" -H 'Transfer-Encoding: chunked' --data-binary @- "$url" >"$reply_file"
            else
              curl --silent --show-error --max-time 30 --proxy 127.0.0.1:3130 \
                -X "$method" --data-binary @"$file" "$url" >"$reply_file"
            fi
            if uv run --locked python -c "
          import json
          reply = json.load(open(r'$reply_file'))
          assert reply.get('sha256') == '$want_sha', reply
          assert reply.get('length') == $want_len, reply
          assert reply.get('method') == '$method', reply
          "; then
              echo "PASS $label"
            else
              echo "FAIL $label: $(cat "$reply_file")"
              fail=1
            fi
          }

          for method in POST PUT PATCH; do
            lower=$(printf '%s' "$method" | tr 'A-Z' 'a-z')
            check_upload "$method" "$small" "$small_sha" 12345 no "$lower-small"
            check_upload "$method" "$big" "$big_sha" $((5 * 1024 * 1024)) no "$lower-big"
            check_upload "$method" "$small" "$small_sha" 12345 yes "$lower-chunked"
          done

          kill "$(cat "$RUNNER_TEMP/px-negotiate.pid")" 2>/dev/null || true
          exit $fail

      - name: Run px and burst 20 HTTPS requests through it
        shell: bash
        env:
          PX_PASSWORD: GoodPass1!
        run: |
          config="$RUNNER_TEMP/px-scenario-burst.ini"
          : > "$config"
          uv run --locked python -m px --config="$config" --foreground --log=4 \
            --listen=127.0.0.1 --port=3129 --noproxy= \
            --proxy=127.0.0.1:31282 --auth=NTLM --username='CORP\pxgood' \
            --threads=64 --socktimeout=10 > "$RUNNER_TEMP/px-windows.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/px.pid"
          for i in $(seq 1 30); do
            rc=0
            curl --connect-timeout 1 --silent --output /dev/null http://127.0.0.1:3129 || rc=$?
            [ $rc -ne 7 ] && break
            sleep 1
          done
          fail=0
          for i in $(seq 1 20); do
            code=$(curl --silent --show-error --insecure --max-time 15 \
              --proxy 127.0.0.1:3129 --output /dev/null --write-out '%{http_code}' \
              https://origin.corp.test:8443/small) || code=000
            [ "$code" = "200" ] || { echo "request $i failed: $code"; fail=1; }
          done
          kill "$(cat "$RUNNER_TEMP/px.pid")" 2>/dev/null || true
          exit $fail

      - name: Collect Px log
        if: failure()
        shell: bash
        run: |
          mkdir -p scenario-artifacts
          cp "$RUNNER_TEMP/px-windows.log" scenario-artifacts/ 2>/dev/null || true
          cp "$RUNNER_TEMP/px-windows-negotiate.log" scenario-artifacts/ 2>/dev/null || true

      - name: Collect Squid and Samba logs from WSL2
        if: failure()
        shell: wsl-bash {0}
        run: |
          bash tests/scenarios/env/scenario-env.sh logs > compose.log 2>&1 || true
          docker exec px-scenario-client-1 sh -c 'cd /scenario-logs && tail -n +1 *' > squid-logs.txt 2>&1 || true

      - name: Upload scenario logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: scenario-logs-windows
          path: |
            scenario-artifacts
            compose.log
            squid-logs.txt
          retention-days: 7

      - name: Tear down the scenario environment
        if: always()
        shell: wsl-bash {0}
        run: SCENARIO_HOST_PORTS=1 bash tests/scenarios/env/scenario-env.sh down
