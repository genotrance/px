name: "Setup Python Environment"
description: "Set up Python environment for the given Python version"

inputs:
  python-version:
    description: "Python version to use"
    required: true
    default: "3.13"
  check-latest:
    description: "Resolve the newest published patch release instead of the runner's cached one"
    required: false
    default: "false"
  refresh-quickjs:
    description: "Resolve the newest quickjs-ng release for a release build"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}
        check-latest: ${{ inputs.check-latest }}
        allow-prereleases: true

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: "true"
        cache-suffix: ${{ inputs.python-version }}

    - name: Install locked dependencies
      run: |
        if [ "${{ inputs.refresh-quickjs }}" = "true" ]; then
          # Release builds deliberately resolve the latest quickjs-ng.
          uv sync --upgrade-package quickjs-ng
        else
          uv sync --locked
        fi
        uv pip install -e .
        uv run --locked python -c "from importlib.metadata import version; print(f'quickjs-ng version: {version(\"quickjs-ng\")}')"
      shell: bash
