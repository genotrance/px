name: Dependency refresh

on:
  schedule:
    - cron: "17 6 * * 2"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Prepare and report the candidate without pushing, opening a pull request, or dispatching CI
        type: boolean
        default: true

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: dependency-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
    steps:
      - name: Check out devel
        uses: actions/checkout@v7
        with:
          ref: devel
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v7

      - name: Install the locked environment
        run: uv sync --locked

      - name: Detect and prepare updates
        id: prepare
        run: |
          python3 tools.py --auto-release --output /tmp/auto-release.json
          {
            echo "changed=$(jq -r .changed /tmp/auto-release.json)"
            echo "branch=$(jq -r '.branch // empty' /tmp/auto-release.json)"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Dependency refresh detection"
            echo
            echo '```json'
            cat /tmp/auto-release.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop when everything is current
        if: steps.prepare.outputs.changed != 'true'
        run: echo "devel already has the newest lock and bundled CPython patch."

      - name: Finish dry run
        if: steps.prepare.outputs.changed == 'true' && env.DRY_RUN == 'true'
        run: |
          echo "Dry run: changes were detected but nothing was pushed, opened, or dispatched."
          git diff --stat >> "$GITHUB_STEP_SUMMARY"

      - name: Find an existing open refresh pull request
        if: steps.prepare.outputs.changed == 'true' && env.DRY_RUN != 'true'
        id: existing
        run: |
          EXISTING=$(gh pr list --state open --base devel --json number,headRefName \
            --jq '[.[] | select(.headRefName | startswith("deps/refresh-"))][0] // empty')
          if [ -n "$EXISTING" ]; then
            echo "number=$(echo "$EXISTING" | jq -r .number)" >> "$GITHUB_OUTPUT"
            echo "branch=$(echo "$EXISTING" | jq -r .headRefName)" >> "$GITHUB_OUTPUT"
          else
            echo "branch=${{ steps.prepare.outputs.branch }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push the refresh branch
        if: steps.prepare.outputs.changed == 'true' && env.DRY_RUN != 'true'
        id: push
        env:
          BRANCH: ${{ steps.existing.outputs.branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add uv.lock .github/bundled-python-version docs/changelog.md
          git commit -m "Refresh locked dependencies"
          REMOTE_SHA=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)
          if [ -n "$REMOTE_SHA" ]; then
            git push --force-with-lease="refs/heads/$BRANCH:$REMOTE_SHA" \
              origin "HEAD:refs/heads/$BRANCH"
          else
            git push origin "HEAD:refs/heads/$BRANCH"
          fi

      - name: Open or update the pull request
        if: steps.push.outcome == 'success'
        env:
          BRANCH: ${{ steps.existing.outputs.branch }}
          NUMBER: ${{ steps.existing.outputs.number }}
        run: |
          {
            echo "Automated dependency refresh. Changed locked dependencies:"
            echo
            CHANGES=$(jq -r '.dependencies[]' /tmp/auto-release.json)
            if [ -n "$CHANGES" ]; then
              echo "$CHANGES" | sed 's/^/- /'
            else
              echo "- (none; only the bundled CPython patch changed)"
            fi
            OLD_PYTHON=$(jq -r .old_python /tmp/auto-release.json)
            NEW_PYTHON=$(jq -r .python /tmp/auto-release.json)
            if [ "$OLD_PYTHON" != "$NEW_PYTHON" ]; then
              TAG=$(echo "$NEW_PYTHON" | tr -d .)
              echo
              echo "Bundled CPython: $OLD_PYTHON -> $NEW_PYTHON (https://www.python.org/downloads/release/python-$TAG/)"
            fi
            echo
            echo "Full CI (\`ci.yml\`, \`full=true\`) was dispatched on this branch."
          } > /tmp/pr-body.md
          if [ -n "$NUMBER" ]; then
            gh pr edit "$NUMBER" --body-file /tmp/pr-body.md
          else
            gh pr create --base devel --head "$BRANCH" \
              --title "Refresh locked dependencies ($BRANCH)" --body-file /tmp/pr-body.md
          fi

      - name: Dispatch CI on the pull request branch
        if: steps.push.outcome == 'success'
        env:
          BRANCH: ${{ steps.existing.outputs.branch }}
        run: gh workflow run ci.yml --ref "$BRANCH" -f full=true
