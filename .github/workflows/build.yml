name: Build

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      mode:
        description: Select release mode automatically or force a new/finish run
        type: choice
        options: [auto, new, finish]
        default: auto
      dry_run:
        description: Compute and display the plan without publishing
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A manual devel build is the complete pre-release gate. Master is already
  # gated by auto-release's full CI run for its exact release candidate.
  ci-full:
    needs: setup
    if: github.event_name == 'workflow_dispatch' && needs.setup.outputs.mode == 'new'
    uses: ./.github/workflows/ci.yml
    with:
      full: true

  # Extract version from pyproject.toml
  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      mode: ${{ steps.plan.outputs.mode }}
      dry_run: ${{ steps.plan.outputs.dry_run }}
      pypi_exists: ${{ steps.plan.outputs.pypi_exists }}
      github_release_exists: ${{ steps.plan.outputs.github_release_exists }}
      missing_assets: ${{ steps.plan.outputs.missing_assets }}
      docker_tags: ${{ steps.plan.outputs.docker_tags }}
      winget_exists: ${{ steps.plan.outputs.winget_exists }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve version
        id: resolve
        run: |
          VERSION=$(python3 -c "import re, pathlib; text = pathlib.Path('pyproject.toml').read_text(); m = re.search(r'version = \"(.+?)\"', text); print(m.group(1))")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Plan release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'auto' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          PLAN=$(python3 tools.py --release-plan="$VERSION" --mode="$MODE" --dry-run="$DRY_RUN")
          echo "$PLAN" | jq .
          {
            echo "mode=$(echo "$PLAN" | jq -r .mode)"
            echo "dry_run=$(echo "$PLAN" | jq -r .dry_run)"
            echo "pypi_exists=$(echo "$PLAN" | jq -r .pypi_exists)"
            echo "github_release_exists=$(echo "$PLAN" | jq -r .github_release_exists)"
            echo "missing_assets=$(echo "$PLAN" | jq -c .missing_assets)"
            echo "docker_tags=$(echo "$PLAN" | jq -r '.docker_tags | join(",")')"
            echo "winget_exists=$(echo "$PLAN" | jq -r .winget_exists)"
          } >> "$GITHUB_OUTPUT"
          echo "### Release plan" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`json" >> "$GITHUB_STEP_SUMMARY"
          echo "$PLAN" | jq . >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "$(echo "$PLAN" | jq -r .mode)" = complete ]; then
            echo "::notice::v$VERSION is already fully published; nothing to do."
          fi

  # Build sdist and pure-Python wheel
  sdist:
    needs: setup
    if: needs.setup.outputs.mode == 'new'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env
        with:
          refresh-quickjs: "true"

      - name: Build sdist and wheel
        run: |
          uv pip install build twine
          uv run --locked python tools.py --wheel

      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: wheel/

  # Build dependency wheels for each platform
  # Platforms limited to intersection of pymcurl and quickjs-ng wheel availability
  wheels:
    needs: setup
    if: needs.setup.outputs.mode == 'new'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            image: "quay.io/pypa/manylinux2014_x86_64"
            name: linux-glibc-x86_64
          - os: ubuntu-24.04-arm
            image: "quay.io/pypa/manylinux2014_aarch64"
            name: linux-glibc-aarch64
          - os: ubuntu-latest
            image: "quay.io/pypa/musllinux_1_2_x86_64"
            name: linux-musl-x86_64
          - os: ubuntu-24.04-arm
            image: "quay.io/pypa/musllinux_1_2_aarch64"
            name: linux-musl-aarch64
          - os: macos-15
            name: mac-arm64
          - os: windows-latest
            name: windows-amd64

    runs-on: ${{ matrix.os }}
    name: wheels ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v7

      - name: Build wheels (Linux container)
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v ${{ github.workspace }}:/px -w /px \
            ${{ matrix.image }} /bin/bash -c '. /px/build.sh && build_wheels'

      - name: Build wheels (macOS/Windows)
        if: runner.os != 'Linux'
        uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.14"
          refresh-quickjs: "true"

      - name: Build wheels (macOS/Windows) - continue
        if: runner.os != 'Linux'
        shell: bash
        run: . ./build.sh && build_wheels

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.name }}
          path: wheels/

  # Build Nuitka binaries (Linux/macOS) or embedded Python (Windows)
  binary:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            image: "quay.io/pypa/manylinux2014_x86_64"
            name: linux-glibc-x86_64
          - os: ubuntu-24.04-arm
            image: "quay.io/pypa/manylinux2014_aarch64"
            name: linux-glibc-aarch64
          - os: ubuntu-latest
            image: "alpine:3.21"
            name: linux-musl-x86_64
            alpine: true
          - os: ubuntu-24.04-arm
            image: "alpine:3.21"
            name: linux-musl-aarch64
            alpine: true
          - os: macos-15
            name: mac-arm64
          - os: windows-latest
            name: windows-amd64

    runs-on: ${{ matrix.os }}
    name: binary ${{ matrix.name }}
    needs: [setup, sdist, wheels]

    steps:
      - uses: actions/checkout@v7

      - name: Prepare Linux build caches
        if: runner.os == 'Linux'
        run: mkdir -p ".cache/nuitka/${{ matrix.name }}" ".cache/uv/${{ matrix.name }}"

      - name: Restore Nuitka cache
        if: runner.os == 'Linux'
        uses: actions/cache@v6
        with:
          path: .cache/nuitka/${{ matrix.name }}
          key: nuitka-4.1.3-${{ matrix.name }}-${{ hashFiles('build.sh', 'tools.py', 'px/**', 'pyproject.toml', 'uv.lock') }}
          restore-keys: |
            nuitka-4.1.3-${{ matrix.name }}-

      - name: Restore uv download cache
        if: runner.os == 'Linux'
        uses: actions/cache@v6
        with:
          path: .cache/uv/${{ matrix.name }}
          key: release-uv-${{ matrix.name }}-${{ hashFiles('uv.lock', 'build.sh') }}
          restore-keys: |
            release-uv-${{ matrix.name }}-

      - name: Set up the environment
        if: runner.os != 'Linux'
        uses: ./.github/actions/setup-python-env
        with:
          check-latest: "true"
          refresh-quickjs: "true"

      # Validate the selected 3.13 interpreter before the build. A newer
      # python.org patch is logged as a warning because build tools can lag.
      - name: Check bundled Python (Linux)
        if: runner.os == 'Linux'
        run: |
          SHELL_BIN="${{ matrix.alpine && '/bin/sh' || '/bin/bash' }}"
          docker run --rm -v ${{ github.workspace }}:/px -w /px \
            ${{ matrix.image }} $SHELL_BIN -c '. /px/build.sh && check_bundled_python ${{ matrix.name }}'

      - name: Check bundled Python (macOS, Windows)
        if: runner.os != 'Linux'
        shell: bash
        run: . ./build.sh && check_bundled_python ${{ matrix.name }}

      - name: Download wheels
        uses: actions/download-artifact@v8
        with:
          name: wheels-${{ matrix.name }}
          path: px.dist-${{ matrix.name }}-wheels/px.dist/

      - name: Download sdist
        uses: actions/download-artifact@v8
        with:
          name: sdist
          path: wheel/

      - name: Build Nuitka binary (Linux)
        if: runner.os == 'Linux'
        run: |
          SHELL_BIN="${{ matrix.alpine && '/bin/sh' || '/bin/bash' }}"
          docker run --rm -v ${{ github.workspace }}:/px -w /px \
            -v ${{ github.workspace }}/.cache/nuitka/${{ matrix.name }}:/root/.cache/Nuitka \
            -v ${{ github.workspace }}/.cache/uv/${{ matrix.name }}:/root/.cache/uv \
            ${{ matrix.image }} $SHELL_BIN -c '. /px/build.sh && build_binary ${{ matrix.name }}'

      - name: Build Nuitka binary (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: . ./build.sh && build_binary ${{ matrix.name }}

      - name: Build embedded binary (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: . ./build.sh && build_binary ${{ matrix.name }}

      # Importing px.handler occurs before --help is processed, so this catches
      # omitted auth dependencies before the much longer artifact test job.
      - name: Smoke binary auth imports (Linux)
        if: runner.os == 'Linux'
        run: |
          SHELL_BIN="${{ matrix.alpine && '/bin/sh' || '/bin/bash' }}"
          docker run --rm -v ${{ github.workspace }}:/px -w /px \
            ${{ matrix.image }} $SHELL_BIN -c '. /px/build.sh && smoke_binary ${{ matrix.name }}'

      - name: Smoke binary auth imports (macOS, Windows)
        if: runner.os != 'Linux'
        shell: bash
        run: . ./build.sh && smoke_binary ${{ matrix.name }}

      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.name }}
          path: |
            px.dist-*/px-v*

  # Test built artifacts across distros
  test-binary:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            container: "quay.io/pypa/musllinux_1_2_x86_64"
            name: linux-musl-x86_64
          - os: ubuntu-24.04-arm
            container: "quay.io/pypa/musllinux_1_2_aarch64"
            name: linux-musl-aarch64
          - os: ubuntu-latest
            container: ubuntu
            name: linux-glibc-x86_64
          - os: ubuntu-24.04-arm
            container: ubuntu
            name: linux-glibc-aarch64
          - os: macos-latest
            name: mac-arm64
          - os: windows-latest
            name: windows-amd64

    runs-on: ${{ matrix.os }}
    name: test-binary ${{ matrix.name }} ${{ matrix.container }}
    needs: [setup, binary]

    steps:
      - uses: actions/checkout@v7

      - name: Download binary artifacts
        uses: actions/download-artifact@v8
        with:
          name: binary-${{ matrix.name }}
          path: ./

      - name: Extract archives
        shell: bash
        run: . ./build.sh && extract_archives ${{ matrix.name }}

      - name: Set up the environment
        if: runner.os != 'Linux'
        uses: ./.github/actions/setup-python-env
        with:
          refresh-quickjs: "true"
          managed-python: "true"

      - name: Test (Linux container)
        if: runner.os == 'Linux'
        run: |
          docker run --rm --privileged \
            -v ${{ github.workspace }}:/px -w /px \
            ${{ matrix.container }} /bin/sh -c '. /px/build.sh && test_binary ${{ matrix.name }}'

      - name: Test (macOS/Windows)
        if: runner.os != 'Linux'
        shell: bash
        env:
          PX_CI_MINIMAL: ${{ runner.os == 'macOS' && '1' || '' }}
        run: . ./build.sh && test_binary ${{ matrix.name }}

  # Tag, create GitHub release, and publish to PyPI
  release:
    if: >-
      always() && github.ref == 'refs/heads/master' &&
      needs.setup.outputs.mode != 'complete' &&
      needs.setup.outputs.dry_run != 'true' &&
      (needs.setup.outputs.mode == 'finish' || needs.test-binary.result == 'success')
    runs-on: ubuntu-latest
    needs: [setup, test-binary]
    permissions:
      id-token: write
      contents: write
    environment: pypi

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all binary artifacts
        if: needs.setup.outputs.mode == 'new'
        uses: actions/download-artifact@v8
        with:
          path: artifacts/
          pattern: binary-*

      - name: Download sdist
        if: needs.setup.outputs.mode == 'new'
        uses: actions/download-artifact@v8
        with:
          name: sdist
          path: artifacts/sdist/

      - name: Collect release assets
        if: needs.setup.outputs.mode == 'new'
        run: |
          mkdir -p release
          find artifacts/binary-* -name 'px-v*' -exec cp {} release/ \;
          cp artifacts/sdist/*.tar.gz release/ || true
          cp artifacts/sdist/*.whl release/ || true

      - name: Download and verify published release assets
        if: needs.setup.outputs.mode == 'finish'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          if [ "${{ needs.setup.outputs.github_release_exists }}" != true ]; then
            echo "::error::v$VERSION exists on PyPI but has no GitHub release; binary artifacts cannot be recovered without rebuilding."
            exit 1
          fi
          mkdir -p release
          gh release download "v$VERSION" --repo genotrance/px --dir release
          cd release
          shopt -s nullglob
          for checksum in *.sha256; do
            archive=${checksum%.sha256}
            [ -f "$archive" ] || { echo "::error::$archive is missing"; exit 1; }
            printf '%s  %s\n' "$(cat "$checksum")" "$archive" | sha256sum --check -
          done
          mkdir -p px.dist-linux-musl-x86_64-wheels
          tar -xzf "px-v$VERSION-linux-musl-x86_64-wheels.tar.gz" \
            -C px.dist-linux-musl-x86_64-wheels

      - name: Restore missing checksums and PyPI assets
        if: needs.setup.outputs.mode == 'finish' && needs.setup.outputs.missing_assets != '[]'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          python3 -m pip download --no-deps --dest release "px-proxy==$VERSION"
          python3 -m pip download --no-deps --no-binary=:all: --dest release "px-proxy==$VERSION"
          missing='${{ needs.setup.outputs.missing_assets }}'
          for name in $(echo "$missing" | jq -r '.[]'); do
            if [[ "$name" == *.sha256 && -f "release/${name%.sha256}" ]]; then
              sha256sum "release/${name%.sha256}" | cut -d' ' -f1 > "release/$name"
            elif [ ! -f "release/$name" ]; then
              echo "::error::Missing release archive $name cannot be recovered without rebuilding."
              exit 1
            fi
            gh release upload "v$VERSION" "release/$name" --repo genotrance/px
          done

      - name: Extract release notes
        run: python3 tools.py --history > /tmp/notes.md

      - name: Create and push tag
        if: needs.setup.outputs.mode == 'new'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="v${{ needs.setup.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping."
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Check for existing GitHub release
        if: needs.setup.outputs.mode == 'new'
        id: release_exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ needs.setup.outputs.version }}" >/dev/null 2>&1; then
            echo "Release v${{ needs.setup.outputs.version }} already exists; leaving it unchanged"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        if: needs.setup.outputs.mode == 'new' && steps.release_exists.outputs.exists != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.setup.outputs.version }}
          name: Px v${{ needs.setup.outputs.version }}
          body_path: /tmp/notes.md
          files: release/*
          prerelease: true

      - name: Publish to PyPI
        if: needs.setup.outputs.mode == 'new' && needs.setup.outputs.pypi_exists != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: artifacts/sdist/
          skip-existing: true

      # v0.12.0's Docker Hub tag is a single amd64 manifest, so retain its
      # architecture rather than silently dropping or adding a platform.
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Check Docker tags
        id: docker_tags
        run: echo "push_tags=${{ needs.setup.outputs.docker_tags }}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker images
        if: steps.docker_tags.outputs.push_tags != ''
        run: python3 tools.py --docker --push --wheels-dir=${{ needs.setup.outputs.mode == 'new' && 'artifacts/binary-linux-musl-x86_64/px.dist-linux-musl-x86_64-wheels' || 'release/px.dist-linux-musl-x86_64-wheels' }}
          --push-tags=${{ steps.docker_tags.outputs.push_tags }}

      - name: Check Winget submission
        id: winget
        if: needs.setup.outputs.winget_exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          manifest="manifests/g/genotrance/px/$VERSION"
          if gh api "repos/microsoft/winget-pkgs/contents/$manifest" >/dev/null 2>&1; then
            echo "Winget manifest for $VERSION already exists"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif test "$(gh pr list --repo microsoft/winget-pkgs --state open \
            --search "genotrance.px $VERSION in:title" --json number --jq 'length')" != 0; then
            echo "An open Winget submission for $VERSION already exists"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to Winget
        if: steps.winget.outputs.publish == 'true'
        uses: vedantmgoyal9/winget-releaser@main
        with:
          identifier: genotrance.px
          version: ${{ needs.setup.outputs.version }}
          installers-regex: '-windows-amd64\.zip$'
          release-tag: v${{ needs.setup.outputs.version }}
          token: ${{ secrets.WINGET_TOKEN }}
