name: "pymcurl devel wheels (temporary)"
description: >-
  TEMPORARY until pymcurl 8.23.0.3 is on PyPI: download this runner's pymcurl
  wheels from the latest successful genotrance/mcurl devel build.yml dry run
  and point pip and uv at them with PIP_FIND_LINKS and UV_FIND_LINKS. Remove
  this action and its callers once mcurl 8.23.0.3 is released (docs/build.md).

runs:
  using: "composite"
  steps:
    - name: Download pymcurl devel wheels
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        dir="$RUNNER_TEMP/mcurl-wheels"
        if [ -d "$dir" ]; then
          echo "pymcurl devel wheels already in $dir"
          exit 0
        fi
        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64) artifact=wheels-ubuntu-latest-x86_64 ;;
          Linux-ARM64) artifact=wheels-ubuntu-24.04-arm-aarch64 ;;
          macOS-ARM64) artifact=wheels-macos-15-arm64 ;;
          Windows-X64) artifact=wheels-windows-latest-x86_64 ;;
          *) echo "No pymcurl devel wheels for $RUNNER_OS-$RUNNER_ARCH"; exit 1 ;;
        esac
        run=$(gh run list -R genotrance/mcurl -w build.yml -b devel -e workflow_dispatch \
          -s success -L 1 --json databaseId -q '.[0].databaseId')
        if [ -z "$run" ]; then
          echo "No successful genotrance/mcurl devel build.yml run found"
          exit 1
        fi
        echo "Using $artifact from https://github.com/genotrance/mcurl/actions/runs/$run"
        gh run download "$run" -R genotrance/mcurl -n "$artifact" -D "$dir"
        ls "$dir"
        {
          echo "MCURL_WHEELS=$dir"
          echo "PIP_FIND_LINKS=$dir"
          echo "UV_FIND_LINKS=$dir"
        } >> "$GITHUB_ENV"
